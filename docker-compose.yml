version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: finora-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: finora
    ports:
      - "5432:5432"
    volumes:
      - finora_data:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    build: .
    container_name: finora-api
    ports:
      - "8080:8080"
    environment:
      - DB_URL=jdbc:postgresql://db:5432/finora
      - DB_USERNAME=postgres
      - DB_PASSWORD=password
      - JWT_SECRET=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      - JWT_EXPIRATION=86400000
    depends_on:
      - db
    restart: unless-stopped

volumes:
  finora_data:
